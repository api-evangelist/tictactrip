      description: '

        Updates a cart with the provided informations. A price lookup is done everytime a cart is patched.

        Keep in mind that patching a cart with an empty payload WILL NOT reset the cart''s data, and will trigger a price lookup with the saved cart''s data.'
      security:
      - authentication:
        - admin
        - bookPartner
      parameters:
      - in: path
        name: cartId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IUpdateCartPayload'
            example:
              passengers:
              - lastName: name
                discountCards: []
                isCustomer: true
                title: MR
                firstName: firstName
                category: adults
                age: 25
                birthdate: '1992-09-09'
              customer:
                lastName: lastName
                mail: mail@mail.com
                isSubscribedToNewsletter: false
                title: MR
                firstName: firstName
                birthdate: '1992-09-09'
      tags:
      - Booking
