aid: tictactrip
name: TicTacTrip
description: >-
  TicTacTrip is a European multimodal travel search and booking platform
  (Techstars-backed) that aggregates train and bus inventory from 250+ carriers
  across 20+ European countries into single, combined itineraries. Its REST API
  exposes stop and city discovery, multimodal itinerary search with CO2 emissions
  per journey, and a full booking workflow — cart, order, book, e-ticket and
  cancellation — authenticated with partner bearer JWTs (API_SEARCH_PARTNER /
  API_BOOK_PARTNER roles). API access is provisioned via sales@tictactrip.eu.
