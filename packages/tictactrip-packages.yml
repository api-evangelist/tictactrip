notes: >-
  First-party open-source libraries published by Tictactrip under the @tictactrip
  npm scope. These are building-block libraries (ground-place identifiers, caching,
  proxying) rather than a full generated REST client; Tictactrip ships no dedicated
  API client SDK — integrators call the REST API at https://api.tictactrip.eu
  directly. ground-place-sdk / gp-uid are the API-adjacent libraries (they generate
  and manage the Ground place unique identifiers used by the stopGroups/stopClusters
  resources).
